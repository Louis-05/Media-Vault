[package]
name = "media-vault"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
mime_guess = "2"
thiserror = "2"
fastembed = "5"
tauri-plugin-drag = "2"
tauri-plugin-clipboard-manager = "2"
arboard = "3"
percent-encoding = "2"
blake3 = "1"
log = "0.4"
flexi_logger = { version = "0.31", features = ["colors"] }

[features]
default = []

[build-dependencies]
tauri-build = { version = "2", features = [] }
chrono = "0.4"

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lib]
name = "media_vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
